[package]
name = "wordle-opt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Finds the best Wordle openers by exhaustive search"
repository = "https://github.com/LucioTD/wordle-opt"

[dependencies]
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
